name: Test Extension

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

  playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: npm run test:smoke

      - name: Publish summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const resultsPath = "test-results/playwright/results.json";
            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            if (!fs.existsSync(resultsPath)) {
              fs.appendFileSync(summaryPath, "## Playwright smoke tests\n\nNo results file was produced.\n");
              process.exit(0);
            }
            const { stats } = JSON.parse(fs.readFileSync(resultsPath, "utf8"));
            const lines = [
              "## Playwright smoke tests",
              "",
              "| Passed | Failed | Flaky | Skipped | Duration |",
              "|---|---|---|---|---|",
              "| " + stats.expected + " | " + stats.unexpected + " | " + stats.flaky + " | " + stats.skipped + " | " + (stats.duration / 1000).toFixed(1) + "s |",
              "",
              "Full HTML report with traces, videos, and screenshots is attached below as the `playwright-report` artifact."
            ];
            fs.appendFileSync(summaryPath, lines.join("\n") + "\n");
          '

      - name: Copy JSON results into report
        if: always()
        run: cp test-results/playwright/results.json playwright-report/results.json || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: error

  pages:
    needs: playwright
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Download Playwright report
        uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: playwright-report

      - name: Determine deployment path
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "dir=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract test screenshots
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const resultsPath = "playwright-report/results.json";
            const outDir = "playwright-report/screenshots";
            fs.mkdirSync(outDir, { recursive: true });

            if (!fs.existsSync(resultsPath)) {
              console.log("No results.json found, skipping screenshot extraction.");
              fs.writeFileSync(path.join(outDir, "manifest.json"), "[]");
              process.exit(0);
            }

            const json = JSON.parse(fs.readFileSync(resultsPath, "utf8"));
            const shots = [];

            function walk(suite) {
              for (const spec of suite.specs || []) {
                for (const test of spec.tests || []) {
                  for (const result of test.results || []) {
                    for (const att of result.attachments || []) {
                      if (att.name && att.name.endsWith("-screenshot.png") && att.body) {
                        fs.writeFileSync(path.join(outDir, att.name), Buffer.from(att.body, "base64"));
                        shots.push({ title: spec.title, name: att.name });
                      }
                    }
                  }
                }
              }
              for (const nested of suite.suites || []) walk(nested);
            }

            for (const suite of json.suites || []) walk(suite);
            fs.writeFileSync(path.join(outDir, "manifest.json"), JSON.stringify(shots, null, 2));
            console.log(`Extracted ${shots.length} screenshot(s).`);
          '

      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: playwright-report
          destination_dir: ${{ steps.target.outputs.dir }}
          keep_files: true

      - name: Prepare root index redirect
        run: |
          mkdir -p gh-pages-root
          cat > gh-pages-root/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=./main/">
              <title>MyTE Autofill - Playwright reports</title>
            </head>
            <body>
              <p>Redirecting to the latest <a href="./main/">main branch Playwright report</a>...</p>
            </body>
          </html>
          HTML

      - name: Publish root index to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages-root
          keep_files: true

      - name: Publish preview link
        run: |
          {
            echo "## Playwright report (GitHub Pages)"
            echo ""
            echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ steps.target.outputs.dir }}/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");

            const prNumber = context.payload.pull_request.number;
            const baseUrl = `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ steps.target.outputs.dir }}/`;
            const marker = "<!-- playwright-report-link -->";

            let screenshotsSection = "";
            const manifestPath = "playwright-report/screenshots/manifest.json";
            if (fs.existsSync(manifestPath)) {
              const shots = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
              if (shots.length) {
                screenshotsSection = "\n\n" + shots
                  .map((shot) => `**${shot.title}**\n\n![${shot.title}](${baseUrl}screenshots/${shot.name})`)
                  .join("\n\n");
              }
            }

            const body = `${marker}\n### Playwright report\n\n${baseUrl}\n\nUpdated on every push to this PR.${screenshotsSection}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const existing = comments.find((comment) => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              });
            }